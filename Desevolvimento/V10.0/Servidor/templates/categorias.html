<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0d1117">
<title>Categorias · RRFS Finanças</title>
<style>{% raw %}
:root{--bg:#0d1117;--s1:#151b23;--s2:#1c242f;--ln:#27313e;--tx:#dde5ee;--mt:#8794a6;--in:#4fd1a5;--out:#f2877b;--ac:#7aa2ff;--wn:#e6bf68;--r:10px;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
body.solo{display:block}
a{color:var(--ac)}
.rail{position:sticky;top:0;height:100vh;padding:20px 14px;background:var(--s1);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:4px}
.rail .logo{font-weight:700;font-size:17px;padding:0 10px 14px;letter-spacing:.2px}
.rail .logo small{display:block;font-weight:400;color:var(--mt);font-size:12px}
.rail a{color:var(--mt);text-decoration:none;padding:9px 12px;border-radius:8px}
.rail a:hover{background:var(--s2);color:var(--tx)}
.rail a.on{background:var(--s2);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
.rail .sp{flex:1}
.rail .who{padding:10px 12px;color:var(--mt);font-size:13px;word-break:break-all}
main{padding:26px clamp(14px,3vw,34px) 60px;max-width:1100px;width:100%}
h1{font-size:23px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mt);margin:0 0 20px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:16px 18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:14px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:14px}
.big{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.lbl{color:var(--mt);font-size:13px}
.in{color:var(--in)}.out{color:var(--out)}.mt{color:var(--mt)}.wn{color:var(--wn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.btn{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--ln);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--mt)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.rail a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0b1020;font-weight:600}
.btn.dng{color:var(--out)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ac)}
input[type=file]{padding:6px}
label.f{display:block;margin-bottom:12px;color:var(--mt);font-size:13px}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--tx);font-size:15px}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mt);text-align:left;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mt)}
.pill.ok{color:var(--in);border-color:#25594a}.pill.bad{color:var(--out);border-color:#6b3a35}.pill.wn{color:var(--wn);border-color:#6a5a2b}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px}
.empty{color:var(--mt);padding:22px;text-align:center}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:0;width:min(560px,94vw);max-height:92vh}
dialog.wide{width:min(860px,96vw)}
dialog::backdrop{background:rgba(3,6,10,.7)}
dialog>form,dialog>div.in2{padding:20px 22px;max-height:90vh;overflow:auto}
dialog h2{font-size:18px;margin-bottom:14px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99;pointer-events:none}
#toast div{background:var(--s2);border:1px solid var(--ln);padding:10px 16px;border-radius:10px;box-shadow:0 6px 24px #0008}
#toast div.err{border-color:#6b3a35;color:var(--out)}
.note{background:var(--s2);border-left:3px solid var(--ac);padding:10px 14px;border-radius:6px;color:var(--mt);font-size:14px;margin-bottom:14px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
@media(max-width:760px){
 body{display:block}
 .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:2px;border-right:0;border-bottom:1px solid var(--ln)}
 .rail .logo,.rail .who,.rail .sp{display:none}
 .rail a{white-space:nowrap;padding:8px 11px}
 .rail a.on{box-shadow:inset 0 -3px 0 var(--ac)}
 .two{grid-template-columns:1fr}
 .big{font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.cr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.cr:last-child{border:0}
.rr{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--ln)}
{% endraw %}</style></head>
<body>
<nav class="rail" aria-label="Menu"><div class="logo">RRFS Finanças<small>Servidor web</small></div>
<a href="/dashboard">Painel</a><a href="/transacoes">Transações</a><a href="/categorias">Categorias</a><a href="/emprestimos">Empréstimos</a><a href="/config">Configurações</a>
<div class="sp"></div><div class="who">{{ usuario }}</div><a href="#" onclick="sair();return false">Sair</a></nav>

<main>
<div class="top"><div><h1>Categorias</h1><p class="sub" style="margin:0">Organize e automatize a classificação</p></div>
<button class="btn pri" id="bnew">Nova categoria</button></div>
<div class="card" id="lista"></div>
</main>
<dialog id="dc"><form method="dialog" id="fc"><h2 id="dct">Nova categoria</h2>
<label class="f">Nome<input id="cn" maxlength="60" required></label>
<div class="acts"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri">Salvar</button></div></form></dialog>
<dialog id="dr"><div class="in2"><h2 id="drt">Regras</h2>
<div class="note">Na importação de PDF, transações sem categoria cuja descrição combine com uma regra recebem esta categoria automaticamente.</div>
<div id="rl"></div>
<form id="fr" class="two" style="margin-top:14px;grid-template-columns:1fr 150px auto;align-items:end">
<label class="f" style="margin:0">Texto<input id="rt" maxlength="80" required placeholder="ex.: mercado"></label>
<label class="f" style="margin:0">Tipo<select id="rm"><option value="contains">Contém</option><option value="starts_with">Começa com</option><option value="exact">Exato</option></select></label>
<button class="btn pri">Adicionar</button></form>
<div class="acts"><button class="btn" data-fechar>Fechar</button></div></div></dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script>{% raw %}
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dbr=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';
const hoje=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const mesAtual=()=>hoje().slice(0,7);
function toast(m,err){const b=$('#toast'),d=document.createElement('div');d.textContent=m;if(err)d.className='err';b.appendChild(d);setTimeout(()=>d.remove(),err?5000:2800)}
async function api(u,o={}){
  const h={};let b=o.body;
  if(b!==undefined&&!(b instanceof FormData)){h['Content-Type']='application/json';b=JSON.stringify(b)}
  const r=await fetch(u,{method:o.method||(b!==undefined?'POST':'GET'),headers:h,body:b,credentials:'same-origin'});
  if(r.status===401&&!u.includes('/entrar')){location='/login';throw new Error('Sessão expirada')}
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok||(d&&d.erro))throw new Error((d&&(d.erro||d.mensagem))||('Erro '+r.status));
  return d}
async function agir(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){toast(e.message,1)}}
function abrir(id){const d=document.getElementById(id);d.showModal();return d}
function fechar(el){(el.closest?el.closest('dialog'):document.getElementById(el)).close()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fechar]');if(b){e.preventDefault();fechar(b)}});
function marcarNav(){$$('.rail a').forEach(a=>{if(a.getAttribute('href')===location.pathname)a.classList.add('on')})}
async function sair(){await agir(()=>api('/api/sair',{method:'POST',body:{}}));location='/login'}
function copiar(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(()=>toast('Copiado'));const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copiado')}catch(e){toast('Copie manualmente',1)}a.remove()}
marcarNav();

let cats=[],ed=null,rc=null;
const TM={contains:'contém',starts_with:'começa com',exact:'exato'};
async function carregar(){
  try{cats=await api('/api/categorias');
    $('#lista').innerHTML=cats.length?cats.map(c=>{const lo=c.name.startsWith('Empréstimo:');
      return `<div class="cr"><div><b>${esc(c.name)}</b> ${lo?'<span class="pill wn">empréstimo</span>':''}<div class="lbl">${c.usos} transaç${c.usos==1?'ão':'ões'}${c.year?' · '+c.year:''}</div></div>
      <div class="row">${lo?'<a class="btn sm" style="text-decoration:none" href="/emprestimos">Abrir empréstimos</a>':`<button class="btn sm" data-r="${c.id}">Regras</button><button class="btn sm" data-e="${c.id}">Renomear</button><button class="btn sm dng" data-x="${c.id}">Excluir</button>`}</div></div>`}).join(''):'<div class="empty">Nenhuma categoria ainda. Crie a primeira.</div>'}
  catch(e){toast(e.message,1)}}
$('#bnew').onclick=()=>{ed=null;$('#dct').textContent='Nova categoria';$('#cn').value='';abrir('dc');$('#cn').focus()};
$('#fc').onsubmit=async e=>{e.preventDefault();
  const r=await agir(()=>api(ed?'/api/categorias/'+ed:'/api/categorias',{method:ed?'PUT':'POST',body:{name:$('#cn').value}}),'Categoria salva');
  if(r){fechar('dc');carregar()}};
$('#lista').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.e){const c=cats.find(x=>x.id==b.dataset.e);ed=c.id;$('#dct').textContent='Renomear categoria';$('#cn').value=c.name;abrir('dc')}
  if(b.dataset.x){const c=cats.find(x=>x.id==b.dataset.x);if(!confirm(`Excluir "${c.name}"?`+(c.usos?`\nAs ${c.usos} transações serão mantidas.`:'')))return;
    const r=await agir(()=>api('/api/categorias/'+c.id,{method:'DELETE'}));if(r){toast(r.mensagem||'Feito');carregar()}}
  if(b.dataset.r){rc=cats.find(x=>x.id==b.dataset.r);$('#drt').textContent='Regras · '+rc.name;abrir('dr');regras()}};
async function regras(){
  try{const l=await api(`/api/categorias/${rc.id}/regras`);
    $('#rl').innerHTML=l.length?l.map(r=>`<div class="rr"><span><b>${esc(r.rule_text)}</b> <span class="lbl">${TM[r.match_type]||r.match_type}</span></span><button class="btn sm dng" data-d="${r.id}">Remover</button></div>`).join(''):'<div class="empty">Nenhuma regra</div>'}
  catch(e){toast(e.message,1)}}
$('#fr').onsubmit=async e=>{e.preventDefault();
  if(await agir(()=>api(`/api/categorias/${rc.id}/regras`,{body:{rule_text:$('#rt').value,match_type:$('#rm').value}}),'Regra adicionada')){$('#rt').value='';regras()}};
$('#rl').onclick=async e=>{const b=e.target.closest('[data-d]');if(b&&await agir(()=>api(`/api/categorias/${rc.id}/regras/${b.dataset.d}`,{method:'DELETE'}),'Regra removida'))regras()};
carregar();
{% endraw %}</script></body></html>
