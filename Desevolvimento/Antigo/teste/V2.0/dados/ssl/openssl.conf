
[req]
default_bits = 4096
prompt = no
default_md = sha256
distinguished_name = dn
x509_extensions = v3_req

[dn]
C=BR
ST=Brasil
L=Local
O=GestaoFinanceira
OU=Sistema
CN=Android

[v3_req]
subjectAltName = @alt_names
keyUsage = nonRepudiation, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth

[alt_names]
DNS.1 = localhost
DNS.2 = Android
IP.1 = 127.0.0.1
IP.2 = 10.0.0.254
